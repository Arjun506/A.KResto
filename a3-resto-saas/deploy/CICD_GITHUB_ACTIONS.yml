name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint_build_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: API lint/build
        working-directory: apps/api
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Web lint/build
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run build

      - name: API tests (optional)
        working-directory: apps/api
        run: npm test

  docker_build:
    runs-on: ubuntu-latest
    needs: [lint_build_test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker build -f apps/api/Dockerfile -t a3-resto-api:ci . || true
          docker build -f apps/web/Dockerfile -t a3-resto-web:ci . || true
          docker compose build
